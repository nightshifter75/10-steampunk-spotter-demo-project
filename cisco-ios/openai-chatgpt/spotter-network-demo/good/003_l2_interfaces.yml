---
- name: 003 - Configure Layer 2 switchports
  hosts: cisco_ios
  gather_facts: false

  tasks:
    - name: 003 - 001 - Configure access and trunk ports declaratively
      cisco.ios.ios_l2_interfaces:
        config:
          - name: GigabitEthernet1
            mode: trunk
            trunk:
              native_vlan: 99
              allowed_vlans:
                - "10"
                - "20"
                - "99"
          - name: GigabitEthernet2
            mode: access
            access:
              vlan: 10
        state: merged
      when: device_role == 'access_switch'
