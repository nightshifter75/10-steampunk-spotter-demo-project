---
- name: 001 - Configure physical interface properties
  hosts: cisco_ios
  gather_facts: false

  tasks:
    - name: 001 - 001 - Configure interface descriptions and administrative state
      cisco.ios.ios_interfaces:
        config:
          - name: GigabitEthernet1
            description: Uplink managed by Ansible
            enabled: true
          - name: GigabitEthernet2
            description: Service interface managed by Ansible
            enabled: true
        state: merged
