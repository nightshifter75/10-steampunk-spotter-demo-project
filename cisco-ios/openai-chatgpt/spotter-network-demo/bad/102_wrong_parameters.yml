---
# PURPOSE: contains deliberately invalid/unknown module parameters.
- name: 102 - Invalid module parameter demo
  hosts: cisco_ios
  gather_facts: false

  tasks:
    - name: 102 - 001 - Pass a parameter that ios_interfaces does not implement
      cisco.ios.ios_interfaces:
        config:
          - name: GigabitEthernet1
            description: Spotter should inspect this task
        state: merged
        unsupported_magic_parameter: true

    - name: 102 - 002 - Misspell a standard parameter on ios_command
      cisco.ios.ios_command:
        commmands:
          - show version
